<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#42130a">
  <title>FlockWise · Poultry ERP</title>
  <meta name="description" content="The poultry ERP's ML engine: laying-rate forecasts and a weekly flock review.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='2' fill='%23e85d43'/%3E%3Cpath d='M12 19.5c4.2 0 5.3-3.7 5.05-6.7C16.8 9.9 14.4 6 12 6s-4.8 3.9-5.05 6.8C6.7 15.8 7.8 19.5 12 19.5z' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Urbanist:wght@400..700&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar-desktop" data-sidebar></aside>

    <div class="mobile-bar">
      <button type="button" class="icon-btn" data-open-drawer aria-label="Open navigation" data-icon="menu"></button>
      <span class="mobile-title"><span class="brand-mark" data-icon="bird"></span>FlockWise</span>
    </div>

    <div class="drawer" data-drawer hidden>
      <div class="drawer-backdrop" data-close-drawer></div>
      <div class="drawer-panel">
        <button type="button" class="icon-btn drawer-close" data-close-drawer aria-label="Close navigation" data-icon="x"></button>
        <div data-sidebar style="height: 100%"></div>
      </div>
    </div>

    <main>
      <div class="container" id="view"></div>
    </main>
  </div>

  <template id="sidebar-template">
    <div class="sidebar">
      <a href="#/review" class="brand">
        <span class="brand-mark" data-icon="bird"></span>
        <span>
          <span class="brand-name">FlockWise</span>
          <span class="brand-sub">Poultry ERP · ML engine</span>
        </span>
      </a>
      <nav class="nav">
        <a href="#/review" data-route="review"><span class="pip"></span><span data-icon="clipboard"></span>Flock review</a>
        <a href="#/model" data-route="model"><span class="pip"></span><span data-icon="chart"></span>The model</a>
      </nav>
      <div class="sidebar-foot">
        <div class="model-chip" data-model-chip><span class="pip"></span><span data-model-text>Checking model…</span></div>
      </div>
      <div class="wordmark" aria-hidden="true">flockwise</div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
